<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Titre & description de base -->
    <title>Eleza RDC – Journalisme vidéo indépendant en RDC</title>
    <meta
      name="description"
      content="Eleza RDC forme les jeunes vidéastes aux droits humains, à l'environnement et au fact-checking. Productions vidéo indépendantes au Congo et dans les Grands Lacs."
    />
    <meta
      name="keywords"
      content="Eleza RDC, journalisme vidéo, droits humains, environnement, fact-checking, jeune vidéaste, RDC"
    />
    <meta name="author" content="Eleza RDC" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://elezardc.org/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elezardc.org/" />
    <meta
      property="og:title"
      content="Eleza RDC – Former les vidéastes engagés d'Afrique centrale"
    />
    <meta
      property="og:description"
      content="Organisation non gouvernementale qui promeut un journalisme de qualité à travers la production vidéo indépendante. Focus : droits humains, environnement, lutte contre la désinformation."
    />
    <meta
      property="og:image"
      content="https://apisiteweb.elezardc.org/uploads/logo_.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Eleza RDC" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Eleza RDC – Vidéos pour les droits humains et l'environnement"
    />
    <meta
      name="twitter:description"
      content="Rejoignez une communauté de jeunes vidéastes qui changent le récit en RDC et dans les Grands Lacs."
    />
    <meta
      name="twitter:image"
      content="https://apisiteweb.elezardc.org/uploads/logo_.jpg"
    />

    <!-- Icône du site (favicon) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://apisiteweb.elezardc.org/uploads/logo_.jpg"
    />
    <link
      rel="apple-touch-icon"
      href="https://apisiteweb.elezardc.org/uploads/logo_.jpg"
    />

    <!-- Préchargement des ressources externes -->
    <link rel="preconnect" href="https://apisiteweb.elezardc.org" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Point d'entrée de l'application Vite (développement) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
